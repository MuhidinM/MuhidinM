  <linearGradient id="g-ash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d3d6de"/><stop offset="1" stop-color="#b3b7c1"/></linearGradient>
  <linearGradient id="g-glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7d0ff"/><stop offset="1" stop-color="#8fa2ff"/></linearGradient>
