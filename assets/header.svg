  <filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fafafa"/><stop offset="0.55" stop-color="#c7d0ff"/><stop offset="1" stop-color="#7b8cff"/></linearGradient>
  <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3a50ff" stop-opacity="0.55"/><stop offset="0.6" stop-color="#1f30ff" stop-opacity="0.12"/><stop offset="1" stop-color="#1f30ff" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity="0.06"/></pattern>
  <clipPath id="card"><rect width="1200" height="440" rx="24"/></clipPath>
</defs>
<style>
  .press{animation:press 7s cubic-bezier(.3,.7,.4,1) infinite}
  @keyframes press{0%,6%,100%{transform:translateY(0)}2%{transform:translateY(5px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .role{opacity:0;animation:role 9s ease-in-out infinite}
  @keyframes role{0%{opacity:0;transform:translateY(14px)}4%,30%{opacity:1;transform:translateY(0)}34%,100%{opacity:0;transform:translateY(-10px)}}
  .caret{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .float{animation:float 6s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px)}}
</style>
