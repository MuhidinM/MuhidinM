  <linearGradient id="g-ash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d3d6de"/><stop offset="1" stop-color="#b3b7c1"/></linearGradient>
  <linearGradient id="g-glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7d0ff"/><stop offset="1" stop-color="#8fa2ff"/></linearGradient>
  <radialGradient id="g-cobalt" cx="0.5" cy="0" r="1.1"><stop offset="0" stop-color="#6a7cff"/><stop offset="0.55" stop-color="#2633d4"/><stop offset="1" stop-color="#141c8f"/></radialGradient>
  <linearGradient id="g-lime" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcc755"/><stop offset="1" stop-color="#9aa53a"/></linearGradient>
