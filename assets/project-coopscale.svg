        <rect x="14" y="41" width="92" height="5" rx="2.5" fill="#d4d4d8"/>
        <text x="14" y="72" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#52525b">ci.yml</text>
