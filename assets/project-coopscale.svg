<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330" role="img" aria-label="CoopScale HR: Took a bank's HR system to Kubernetes, with CI/CD and monitoring built from scratch.">
<defs>
